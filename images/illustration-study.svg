<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="studyTitle">
  <title id="studyTitle">Illustration of a learner sitting at a desk studying with a laptop and books</title>
  <rect width="400" height="300" rx="24" fill="#edf6ff"/>
  <!-- desk -->
  <rect x="60" y="200" width="280" height="14" rx="4" fill="#0d5ea8"/>
  <rect x="80" y="214" width="14" height="50" fill="#0a467f"/>
  <rect x="306" y="214" width="14" height="50" fill="#0a467f"/>
  <!-- laptop -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="100" height="60" rx="6" fill="#ffffff" stroke="#0d5ea8" stroke-width="3"/>
    <rect x="-10" y="60" width="120" height="10" rx="4" fill="#0d5ea8"/>
    <line x1="15" y1="20" x2="85" y2="20" stroke="#2cb67d" stroke-width="4"/>
    <line x1="15" y1="35" x2="65" y2="35" stroke="#2cb67d" stroke-width="4"/>
  </g>
  <!-- stack of books -->
  <g transform="translate(240,168)">
    <rect x="0" y="10" width="60" height="12" rx="2" fill="#2cb67d"/>
    <rect x="4" y="-2" width="52" height="12" rx="2" fill="#0d5ea8"/>
    <rect x="0" y="-14" width="60" height="12" rx="2" fill="#1d8e63"/>
  </g>
  <!-- person -->
  <g transform="translate(90,120)">
    <circle cx="20" cy="0" r="16" fill="#0a467f"/>
    <path d="M0 40 C0 20 40 20 40 40 L40 60 L0 60 Z" fill="#2cb67d"/>
  </g>
</svg>
